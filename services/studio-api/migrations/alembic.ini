[alembic]
script_location = %(here)s
prepend_sys_path = ../src
path_separator = os
# URL is taken from STUDIO_DATABASE_URL at runtime (env.py); this is a
# documentation-only fallback for local disposable databases.
sqlalchemy.url = postgresql://studio:studio@127.0.0.1:54329/studio

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
