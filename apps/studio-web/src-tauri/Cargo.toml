[package]
name = "chemistry-studio-desktop"
version = "0.1.0"
description = "Chemistry Studio native local research workspace"
authors = ["Chemistry Studio"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "s"
debug = 0
strip = true
incremental = false
panic = "abort"
